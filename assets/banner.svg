<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f1f5f9;
    }
    .timer-num {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 18px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="100" r="160" fill="#38bdf8" filter="url(#glow)" opacity="0.12">
    <animate attributeName="cx" values="150;180;150" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;130;100" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="320" r="180" fill="#a855f7" filter="url(#glow)" opacity="0.14">
    <animate attributeName="cx" values="1050;1010;1050" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="320;290;320" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="90" r="120" fill="#10b981" filter="url(#glow)" opacity="0.1">
    <animate attributeName="cy" values="90;120;90" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Dynamic Progress / Activity Chart at Bottom Right (stays background) -->
  <g transform="translate(850, 240)" opacity="0.85">
    <!-- Bar 1 -->
    <rect x="0" y="40" width="22" height="70" rx="4" fill="url(#cyanGrad)">
      <animate attributeName="height" values="70;100;40;70" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y" values="40;10;70;40" dur="4s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 2 -->
    <rect x="32" y="20" width="22" height="90" rx="4" fill="url(#purpleGrad)">
      <animate attributeName="height" values="90;50;105;90" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;60;5;20" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 3 -->
    <rect x="64" y="60" width="22" height="50" rx="4" fill="url(#emeraldGrad)">
      <animate attributeName="height" values="50;95;60;50" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="60;15;50;60" dur="3.8s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 4 -->
    <rect x="96" y="30" width="22" height="80" rx="4" fill="url(#cyanGrad)">
      <animate attributeName="height" values="80;40;90;80" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="30;70;20;30" dur="4.2s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 5 -->
    <rect x="128" y="10" width="22" height="100" rx="4" fill="url(#purpleGrad)">
      <animate attributeName="height" values="100;65;110;100" dur="5s" repeatCount="indefinite" />
      <animate attributeName="y" values="10;45;0;10" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Baseline -->
    <line x1="-15" y1="115" x2="165" y2="115" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Animated Pulse Clock Icon (Upper Right Background Decor) -->
  <g transform="translate(1000, 110)">
    <circle cx="0" cy="0" r="42" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />
    <!-- Clock Hands (Smooth Rotating) -->
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="0" x2="15" y2="0" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="72s" repeatCount="indefinite" />
    </line>
    <circle cx="0" cy="0" r="4" fill="#f8fafc" />
    <!-- Dynamic Glowing Ring Pulse -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="46;58;46" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND: Header Content (Always crisp, prominent, unobstructed) -->
  <g transform="translate(80, 100)">
    <!-- Category Tag / Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="15" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="20" class="pill-text" fill="#38bdf8" font-size="12">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">Awesome Employee Time Tracking</text>
    <text x="0" y="125" class="title-text">&amp; Logging</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="172" class="subtitle-text">Curated SaaS Platforms, Self-Hosted Timesheets &amp; Open-Source Activity Trackers</text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 215)">
      <!-- Pill 1: SaaS Solutions -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
        <text x="82" y="23" class="pill-text" text-anchor="middle">⚡ SaaS Solutions</text>
      </g>
      <!-- Pill 2: Open Source Tools -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
        <text x="90" y="23" class="pill-text" text-anchor="middle">💻 Open-Source Repos</text>
      </g>
      <!-- Pill 3: Billable Hours -->
      <g transform="translate(375, 0)">
        <rect x="0" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.95" />
        <text x="85" y="23" class="pill-text" text-anchor="middle">⏱️ Billable Hours</text>
      </g>
      <!-- Pill 4: Self-Hosted -->
      <g transform="translate(560, 0)">
        <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
        <text x="80" y="23" class="pill-text" text-anchor="middle">🔒 Self-Hosted</text>
      </g>
    </g>
  </g>
</svg>
